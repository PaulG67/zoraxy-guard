# docker-compose for Unraid / local: pull-only (Force update friendly)
services:
  zoraxy-guard:
    image: ghcr.io/paulg67/zoraxy-guard:latest
    pull_policy: always
    container_name: zoraxy-guard
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      TZ: Europe/Zurich
      ZORAXY_GUARD_CONFIG: /config/config.yaml
      WEB_ENABLED: "true"
      WEB_PORT: "8787"
      WEB_PASSWORD: "change-me"
    volumes:
      - /mnt/user/appdata/zoraxy/log:/logs:ro
      - /mnt/user/appdata/zoraxy-guard/config.yaml:/config/config.yaml
      - /mnt/user/appdata/zoraxy-guard/data:/data
      # Optional: CrowdSec YAML in der GUI (Reiter CrowdSec → YAML / Listen)
      # - /mnt/user/appdata/crowdsec:/crowdsec-config
      # - /mnt/user/appdata/zoraxy/plugin/zoraxy_crowdsec_bouncer:/crowdsec-bouncer
