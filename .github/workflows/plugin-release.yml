# Builds the zoraxy-guard-blocker plugin for multiple platforms and
# publishes it as a rolling "latest" GitHub Release, so it can be installed
# on Zoraxy without a local Go/Docker toolchain.
name: Build and release zoraxy-guard-blocker plugin

on:
  push:
    branches: [main]
    paths:
      - "plugin/zoraxy-guard-blocker/**"
      - ".github/workflows/plugin-release.yml"
  pull_request:
    paths:
      - "plugin/zoraxy-guard-blocker/**"
      - ".github/workflows/plugin-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/zoraxy-guard-blocker
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Vet
        run: go vet ./...

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt would reformat:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          out="zoraxy-guard-blocker_${{ matrix.goos }}_${{ matrix.goarch }}${ext}"
          go build -trimpath -ldflags="-s -w" -o "$out" .
          sha256sum "$out" > "$out.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            plugin/zoraxy-guard-blocker/zoraxy-guard-blocker_${{ matrix.goos }}_${{ matrix.goarch }}*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist
          merge-multiple: true

      - name: Collect assets + combined checksum file
        run: |
          mkdir -p out
          cp dist/* out/
          cd out && sha256sum * > SHA256SUMS

      - name: Remove previous rolling release (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete zoraxy-guard-blocker-latest --yes --cleanup-tag || true

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zoraxy-guard-blocker-latest
          name: "Zoraxy Guard Blocker — aktueller Build (main)"
          body: |
            Automatisch gebaute Binaries für das `zoraxy-guard-blocker`-Plugin.

            Stand: ${{ github.sha }}

            Installationsanleitung: [plugin/zoraxy-guard-blocker/README.md](https://github.com/${{ github.repository }}/blob/main/plugin/zoraxy-guard-blocker/README.md)

            Diese Release wird bei jeder Änderung am Plugin automatisch überschrieben (rolling "latest").
          prerelease: false
          files: out/*
